# --- Global Engine Settings ---
settings:
  window:
    width: 1280
    height: 720
    title: "Hernan Engine"
    fullscreen: false
    vsync: true
  background_color: [0.0,0.7,1.0,0.1] # RGBA
  
# --- Camera Configuration ---
camera:
  type: "perspective"
  fov: 45.0
  position: [0.0, 2.0, 10.0]
  look_at: [0.0,0.0,1.0]
  up: [0.0,1.0,0.0]
  yaw: 360 # Not used currently
  pitch: 89
  movement_speed: 3
  mouse_sensitivity: 0.05
  
# --- The Scene Graph ---
entities:
  - name: "Sphere"
    type: "mesh"
    path: "assets/models/primitives/sphere.obj"
    transform:
      position: [ 20.0, 1.0, 0.0 ]
      rotation: [ 0.0, -90.0, 0.0 ] # Euler angles in degrees
      scale: [ 1.0, 1.0, 1.0 ]
    material:
      shader: "toon"
      color: [0.5, 0.5, 0.5, 1.0]
      texture_diffuse: "assets/textures/room_texture.png"
      shininess: 32.0
  - name: "Crysis Nanosuit"
    type: "mesh"
    path: "assets/models/crysis/nanosuit.obj"
    transform:
      position: [ 0.0, 0.2, 0.0 ]
      rotation: [ 0.0, -90.0, 0.0 ] # Euler angles in degrees
      scale: [ 1.0, 1.0, 1.0 ]
    material:
      shader: "toon"
      color: [0.5, 0.5, 0.5, 1.0]
      texture_diffuse: "assets/textures/room_texture.png"
      shininess: 32.0
  - name: "Plane"
    type: "mesh"
    path: "assets/models/plane/plane.obj"
    transform:
      position: [ 0.0, -1, 0.0 ]
      rotation: [ 0.0, -90.0, 0.0 ] # Euler angles in degrees
      scale: [ 1.0, 1.0, 1.0 ]
    material:
      shader: "toon"
      color: [1.0, 1.0, 1.0, 1.0]
      texture_diffuse: "assets/textures/room_texture.png"
      shininess: 32.0
      
  
